services:
  postgres:
    image: postgres:16-alpine
    container_name: cfs-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cfs
      POSTGRES_PASSWORD: cfs
      POSTGRES_DB: cfs
    volumes:
      - cfs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfs -d cfs"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cfs_postgres_data:
